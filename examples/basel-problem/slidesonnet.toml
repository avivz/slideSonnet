# slideSonnet config for the Basel Problem demo.
# Kokoro is used now; the ElevenLabs voice ids are kept for a later HQ re-render.

[tts]
backend = "kokoro"

[tts.kokoro]
voice = "am_michael"

[tts.elevenlabs]
voice_id = "aMSt68OGf4xUZAnLpTU8"
model_id = "eleven_v3"

[video]
resolution = "1920x1080"
fps = 24
crf = 23
pre_silence = 0.3
tail_seconds = 0.8

# A second voice for the Bernoulli quote (:voice bernoulli in the sidecar).
[voices.bernoulli]
kokoro = "bm_george"
elevenlabs = "jhYRUrjaLTqNSQTIDKZw"

pronunciation = ["pronunciation/names.md"]
