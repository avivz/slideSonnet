# slideSonnet config for the Basel Problem demo.

# Top-level keys must come before any [table] header.
pronunciation = ["pronunciation/names.md"]

[tts]
backend = "kokoro"

[tts.kokoro]
voice = "am_michael"

[video]
resolution = "1920x1080"
fps = 24
crf = 23
pre_silence = 0.3
tail_seconds = 0.8

# A second voice for the Bernoulli quote (voice: bernoulli in the sidecar).
[voices.bernoulli]
kokoro = "bm_george"
