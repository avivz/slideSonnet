# slideSonnet config for the Basel Problem demo.

# Top-level keys must come before any [table] header.
# IPA pronunciation hints for names (spoken form; see the file's note re: subtitles).
pronunciation = ["pronunciation/names.md"]

[tts]
backend = "kokoro"

[tts.kokoro]
voice = "am_michael"

[video]
resolution = "1920x1080"
fps = 24
crf = 23
pre_silence = 0.3
tail_seconds = 0.8

# Named voices (lecturer + the Bernoulli quote) live in the deck's portable
# voice layer — the `voices:` preamble of basel-problem.narration — so the
# sidecar is self-describing across engines (Kokoro for the demo, Inworld for HQ).
