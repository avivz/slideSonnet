# slideSonnet config for the showcase demo.

# Top-level keys must come before any [table] header.
pronunciation = ["pronunciation/general.md", "pronunciation/names.md"]

[tts]
backend = "kokoro"

[tts.kokoro]
voice = "af_heart"

[video]
resolution = "1920x1080"
fps = 24
crf = 23
pre_silence = 0.3
tail_seconds = 0.6

# Named voices (lecturer + Alex, the questioner) live in the deck's portable
# voice layer — the `voices:` preamble of showcase.narration — so the sidecar is
# self-describing across engines (Kokoro for the demo, Inworld for HQ).
