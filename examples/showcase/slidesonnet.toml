# slideSonnet config for the showcase demo.
# Two Kokoro voices for the dialog.

# Top-level keys must come before any [table] header.
pronunciation = ["pronunciation/general.md", "pronunciation/names.md"]

[tts]
backend = "kokoro"

[tts.kokoro]
voice = "af_heart"

[video]
resolution = "1920x1080"
fps = 24
crf = 23
pre_silence = 0.3
tail_seconds = 0.6

# Alex's questions use a distinct voice (voice: alex in the sidecar).
[voices.alex]
kokoro = "am_michael"
