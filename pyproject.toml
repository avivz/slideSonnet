[build-system]
requires = ["setuptools>=77"]  # PEP 639 license string
build-backend = "setuptools.build_meta"

[project]
name = "slidesonnet"
dynamic = ["version"]
description = "Narrated-video editor for PDF slide decks with a narration sidecar"
readme = "README.md"
license = "MIT"
authors = [{name = "Aviv Zohar"}]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "click>=8.0",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    "numpy>=1.26",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
kokoro = ["kokoro>=0.9"]
inworld = ["inworld-tts>=1.0"]
qwen3 = ["qwen-tts>=0.1", "torch>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "pytest-timeout",
    "httpx",
    "playwright",
    "pytest-playwright",
    "ruff>=0.16.4",
    "mypy>=2.3.1",
]

[project.urls]
Homepage = "https://github.com/avivz/slideSonnet"
Source = "https://github.com/avivz/slideSonnet"

[project.scripts]
slidesonnet = "slidesonnet.cli:main"

[tool.setuptools.dynamic]
version = {attr = "slidesonnet.__version__"}

[tool.setuptools.package-data]
"slidesonnet.templates" = ["*.sty"]
# Recursive: the built frontend nests its assets (B5 — "static/*" would drop them).
"slidesonnet.server" = ["static/**/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
    "inworld_tts.*",
    "dotenv.*",
    "kokoro.*",
    "huggingface_hub.*",
    "qwen_tts.*",
    "torch.*",
    "transformers.*",
    "numpy.*",
]
ignore_missing_imports = true

# PyMuPDF's own hints are partial (Document(), Pixmap(), get_text() untyped):
# treat it as untyped, as its old ``fitz`` name was.
[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"
filterwarnings = [
    # FastAPI's TestClient still wraps httpx; the replacement isn't released yet.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "integration: requires external tools (ffmpeg, pdftoppm, latexmk, kokoro)",
    "browser: heavy real-browser (Playwright) editor journeys; local-only, never in CI",
]
