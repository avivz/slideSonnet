[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slidesonnet"
dynamic = ["version"]
description = "Narrated-video editor for PDF slide decks with a narration sidecar"
readme = "README.md"
license = "MIT"
authors = [{name = "Aviv Zohar"}]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "click>=8.0",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    "nicegui>=2.0",
]

[project.optional-dependencies]
kokoro = ["kokoro>=0.9"]
elevenlabs = ["elevenlabs>=1.0"]
qwen3 = ["qwen-tts>=0.1", "torch>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-timeout",
    "playwright",
    "pytest-playwright",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/avivz/slideSonnet"
Source = "https://github.com/avivz/slideSonnet"

[project.scripts]
slidesonnet = "slidesonnet.cli:main"

[tool.setuptools.dynamic]
version = {attr = "slidesonnet.__version__"}

[tool.setuptools.package-data]
"slidesonnet.templates" = ["*.sty"]
"slidesonnet.gui" = ["static/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
    "elevenlabs.*",
    "dotenv.*",
    "kokoro.*",
    "qwen_tts.*",
    "torch.*",
    "numpy.*",
    "fitz.*",
    "nicegui.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "integration: requires external tools (ffmpeg, pdftoppm, latexmk, kokoro)",
    "browser: heavy real-browser (Playwright) GUI journey tests; local-only, never in CI",
    "nicegui_main_file: NiceGUI user-plugin entry module for in-process GUI tests",
]
