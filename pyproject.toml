[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slidesonnet"
dynamic = ["version"]
description = "Compile text-based presentations into narrated videos"
readme = "README.md"
license = "MIT"
authors = [{name = "Aviv Zohar"}]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "click>=8.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "pymupdf>=1.24",
    "nicegui>=2.0",
]

[project.optional-dependencies]
kokoro = ["kokoro>=0.9"]
elevenlabs = ["elevenlabs>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-timeout",
    "playwright",
    "pytest-playwright",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/avivz/slideSonnet"
Source = "https://github.com/avivz/slideSonnet"

[project.scripts]
slidesonnet = "slidesonnet.cli:main"

[tool.setuptools.dynamic]
version = {attr = "slidesonnet.__version__"}

[tool.setuptools.package-data]
"slidesonnet" = ["*.sty"]
"slidesonnet.templates" = ["*.tex", "*.narration", "*.sty", "*.toml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
    "elevenlabs.*",
    "dotenv.*",
    "kokoro.*",
    "fitz.*",
    "nicegui.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires external tools (ffmpeg, pdftoppm, latexmk, kokoro)",
    "browser: heavy real-browser (Playwright) GUI journey tests; local-only, never in CI",
]
