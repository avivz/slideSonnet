name: CI

on:
  workflow_call:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "examples/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "examples/**"
      - "LICENSE"
      - ".gitignore"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: mypy src/slidesonnet/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # CI runs the fast unit tier only — no heavy tests (integration or
      # browser), to stay within the free-tier minute budget.
      - run: pytest tests/ -m "not integration and not browser" -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - name: Verify wheel ships the LaTeX macro
        run: |
          python -c "
          import zipfile
          whl = list(__import__('pathlib').Path('dist').glob('*.whl'))[0]
          names = zipfile.ZipFile(whl).namelist()
          assert any(n.endswith('templates/slidesonnet.sty') for n in names), \
              f'slidesonnet.sty not packaged: {[n for n in names if n.endswith(\".sty\")]}'
          print(f'Wheel OK: {len(names)} files, macro packaged')
          "
      - name: Smoke-test wheel install
        run: |
          pip install dist/slidesonnet-*.whl
          slidesonnet --version
          slidesonnet doctor || true
