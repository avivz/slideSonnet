name: CI

on:
  workflow_call:
  push:
    branches: [main]
    paths-ignore:
      # Prose only: data .md files (tests/fixtures/*.md, examples/*/pronunciation/*.md)
      # are test inputs and must still trigger CI.
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "docs/**"
      - ".claude/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "docs/**"
      - ".claude/**"
      - "LICENSE"
      - ".gitignore"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Exact linter/type-checker versions (the ones the dev venv resolves), so a
      # new release can't turn CI red on an unchanged tree. Bump them deliberately.
      - run: pip install ruff==0.16.9
      - run: ruff check src/ tests/ scripts/
      - run: ruff format --check src/ tests/ scripts/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]" mypy==2.3.1
      - run: mypy src/slidesonnet/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # CI runs the fast unit tier only — no heavy tests (integration or
      # browser), to stay within the free-tier minute budget. The per-test
      # timeout is a safety net: a background-queue hang fails in ~2 min instead
      # of running to GitHub's 6h ceiling (pytest-timeout ships in [dev]).
      - run: pytest tests/ -m "not integration and not browser" -v --timeout=120 --timeout-method=thread

  # The Vue frontend: lint, type-check, unit tests (Vitest, jsdom — no browser),
  # production build, and a check that the committed API types match the server.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: API types match the server (regenerate, then diff)
        run: |
          pip install -e ..
          python -m slidesonnet.server.openapi openapi.json
          npm run api-types
          git diff --exit-code -- openapi.json src/api/schema.d.ts

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build the frontend into the package
        run: cd frontend && npm ci && npm run build
      - run: pip install build
      - run: python -m build
      - name: Verify wheel ships the LaTeX macro
        run: |
          python -c "
          import zipfile
          whl = list(__import__('pathlib').Path('dist').glob('*.whl'))[0]
          names = zipfile.ZipFile(whl).namelist()
          assert any(n.endswith('templates/slidesonnet.sty') for n in names), \
              f'slidesonnet.sty not packaged: {[n for n in names if n.endswith(\".sty\")]}'
          print(f'Wheel OK: {len(names)} files, macro packaged')
          "
      - name: Smoke-test wheel install
        run: |
          pip install dist/slidesonnet-*.whl
          slidesonnet --version
          slidesonnet doctor || true
      - name: Installed wheel serves the bundled frontend (fresh venv)
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/slidesonnet-*.whl
          cd /tmp && /tmp/wheel-venv/bin/python $GITHUB_WORKSPACE/scripts/smoke_installed_frontend.py
      - name: Installed sdist serves the bundled frontend (fresh venv)
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install dist/slidesonnet-*.tar.gz
          cd /tmp && /tmp/sdist-venv/bin/python $GITHUB_WORKSPACE/scripts/smoke_installed_frontend.py
